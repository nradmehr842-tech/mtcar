name: Build MTcar v25.4 No-SMS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Generate Android host project
        shell: bash
        run: |
          rm -rf /tmp/mtcar_android
          flutter create \
            --platforms=android \
            --org ir.mediatelecom \
            --project-name mtcar \
            /tmp/mtcar_android

          rm -rf mobile/android
          cp -R /tmp/mtcar_android/android mobile/android

      - name: Apply MTcar production native overlay
        shell: bash
        run: |
          chmod +x scripts/apply_android_production_overlay.sh
          scripts/apply_android_production_overlay.sh

      - name: Install packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze production app
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: mobile
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=https://api.mediatelecom.ir

      - name: Prepare artifact
        shell: bash
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk MTcar-v25.4-release.apk

      - name: Upload MTcar APK
        uses: actions/upload-artifact@v4
        with:
          name: MTcar-v25.4-No-SMS-APK
          path: MTcar-v25.4-release.apk
          if-no-files-found: error
          retention-days: 30
