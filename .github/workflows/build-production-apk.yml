name: Build MTcar v25.2 APK + Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Generate Android host project
        shell: bash
        run: |
          rm -rf /tmp/mtcar_android
          flutter create \
            --platforms=android \
            --org ir.mediatelecom \
            --project-name mtcar \
            /tmp/mtcar_android

          rm -rf mobile/android
          cp -R /tmp/mtcar_android/android mobile/android

      - name: Apply MTcar production native overlay
        shell: bash
        run: |
          chmod +x scripts/apply_android_production_overlay.sh
          scripts/apply_android_production_overlay.sh

      - name: Install packages
        working-directory: mobile
        run: flutter pub get

      # Analyzer diagnostics are recorded, but do not stop the APK build.
      - name: Analyze app (non-blocking)
        id: analyze
        working-directory: mobile
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../flutter-analyze.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Flutter analyze exit code: $code"
          exit 0

      # Capture the full compiler output so any real Dart/Android error is visible.
      - name: Build release APK
        id: build
        working-directory: mobile
        shell: bash
        run: |
          set +e
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://api.mediatelecom.ir \
            2>&1 | tee ../flutter-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Flutter build exit code: $code"
          exit 0

      - name: Create concise error summary
        if: always()
        shell: bash
        run: |
          {
            echo "=== MTcar v25.2 diagnostics ==="
            echo "analyze_exit=${{ steps.analyze.outputs.exit_code }}"
            echo "build_exit=${{ steps.build.outputs.exit_code }}"
            echo
            echo "=== Analyzer errors ==="
            grep -Ei "(^|[[:space:]])error([[:space:]•:-]|$)|Error:" flutter-analyze.log | head -n 200 || true
            echo
            echo "=== Build errors ==="
            grep -Ei "(^|[[:space:]])error([[:space:]•:-]|$)|Error:|FAILURE:|What went wrong" flutter-build.log | head -n 250 || true
          } > mtcar-errors-summary.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MTcar-v25.2-Diagnostics
          path: |
            flutter-analyze.log
            flutter-build.log
            mtcar-errors-summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare APK artifact
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk MTcar-v25.2-release.apk

      - name: Upload MTcar APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: MTcar-v25.2-APK
          path: MTcar-v25.2-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Fail job if APK build failed
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "APK build failed. Download artifact: MTcar-v25.2-Diagnostics"
          exit 1
