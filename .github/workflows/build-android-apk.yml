name: Build MTcar Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android project
        shell: bash
        run: |
          rm -rf /tmp/mtcar_gen
          flutter create \
            --platforms=android \
            --org ir.mediatelecom \
            --project-name mtcar \
            /tmp/mtcar_gen

          rm -rf mobile/android
          cp -R /tmp/mtcar_gen/android mobile/android

      - name: Apply MTcar Android native overlay
        shell: bash
        run: |
          chmod +x scripts/apply_android_overlay.sh
          bash scripts/apply_android_overlay.sh

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Rename APK
        shell: bash
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk MTcar-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MTcar-Android-APK
          path: MTcar-debug.apk
          if-no-files-found: error
          retention-days: 30
